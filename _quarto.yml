format:
  html:
    theme: 
      light: [cosmo, custom.scss]
    css:
      - styles.css
      - landing.css
    toc: true
    toc-depth: 3
    toc-location: right
    number-sections: false
    code-fold: false
    code-tools: false
    smooth-scroll: true
    link-external-newwindow: true
    
execute:
  freeze: auto
  echo: false
  warning: false
  message: false
